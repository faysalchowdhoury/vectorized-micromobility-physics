[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorized-micromobility-physics"
version = "1.0.0"
description = "Vectorised 2-D non-lane-based mixed-traffic physics (cars, motorcycles, scooters, cargo bikes): saturation flow, dynamic PCU, Optuna calibration."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26", "pandas>=2.2", "pydantic>=2.6,<3", "matplotlib>=3.8", "optuna>=3.6"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]
dev = ["pytest>=8.0"]

[project.scripts]
micromob = "micromob.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
